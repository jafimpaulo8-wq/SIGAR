<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,doc,getDoc,getDocs,collection,updateDoc,serverTimestamp}
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyDKfHUopcqVmYlDZzRhBPKEYiohuCkypB0",authDomain:"sigar-6754a.firebaseapp.com",projectId:"sigar-6754a",storageBucket:"sigar-6754a.firebasestorage.app",messagingSenderId:"43374879416",appId:"1:43374879416:web:cf96eeb62e6f940fb50a4d"}));
window.CDB={
  async find(q){const snap=await getDocs(collection(db,'alunos'));const ql=q.toLowerCase();return snap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>
    (a.bi&&a.bi.toLowerCase().includes(ql))||(a.numAluno&&a.numAluno.toLowerCase().includes(ql))||(a.nome&&a.nome.toLowerCase().includes(ql))||(a.numeroCarta&&a.numeroCarta.toLowerCase().includes(ql))||(a.numeroSerie&&a.numeroSerie.toLowerCase().includes(ql)));},
  async get(id){const s=await getDoc(doc(db,'alunos',id));return s.exists()?{id:s.id,...s.data()}:null;},
  async saveCarta(id,data){await updateDoc(doc(db,'alunos',id),{...data,updatedAt:serverTimestamp()});}
};
window.CDB_OK=true;document.dispatchEvent(new Event('cdb-ok'));

document.addEventListener('cdb-ok',()=>{
  document.getElementById('dot').classList.add('on');
  document.getElementById('dbl').textContent='☁️ Firebase Ligado';
  document.getElementById('btnV').disabled=false;
  const p=new URLSearchParams(location.search);
  const q=p.get('aluno')||p.get('bi')||p.get('id')||p.get('carta');
  if(q){document.getElementById('si').value=q;buscar();}
});

function buscar(){
  const q=document.getElementById('si').value.trim();
  const r=document.getElementById('sr'),l=document.getElementById('sl'),btn=document.getElementById('btnV');
  if(q.length<2){r.innerHTML='';btn.disabled=true;found=null;l.style.display='none';return;}
  clearTimeout(st);l.style.display='block';r.innerHTML='';btn.disabled=true;
  st=setTimeout(async()=>{
    if(!window.CDB_OK){l.style.display='none';r.innerHTML='<div style="color:var(--red);font-size:12px">⏳ A ligar ao Firebase...</div>';return;}
    try{
      const res=await window.CDB.find(q);
      l.style.display='none';
      if(res.length){
        found=res[0];
        const ini=(found.nome||'?')[0].toUpperCase();
        r.innerHTML=`<div class="fc"><div class="av">${found.foto?`<img src="${found.foto}">`:ini}</div><div style="flex:1"><strong style="font-size:13px;color:var(--navy)">${found.nome||'—'}</strong><br><span style="font-size:10px;color:var(--gr)">${found.curso||'—'}</span>${found.numeroCarta?`<br><span style="font-size:10px;color:var(--gold)">🪪 ${found.numeroCarta}</span>`:''}</div><span style="background:#22C55E;color:#fff;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700">✓</span></div>`;
        btn.disabled=false;
      }else{found=null;r.innerHTML=`<div style="background:#FEE2E2;border-radius:8px;padding:10px;font-size:12px;color:#991B1B;text-align:center">❌ Aluno não encontrado</div>`;}
    }catch(e){l.style.display='none';r.innerHTML=`<div style="background:#FEE2E2;border-radius:8px;padding:10px;font-size:12px;color:#991B1B">❌ Erro: ${e.message}</div>`;}
  },450);
}

function ver(){if(!found)return;A=found;document.getElementById('sw').style.display='none';document.getElementById('app').style.display='block';renderApp();window.scrollTo(0,0);}
function voltarPesquisa(){A=null;found=null;document.getElementById('sw').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('si').value='';document.getElementById('sr').innerHTML='';document.getElementById('btnV').disabled=true;}

function getMaquinas(a){
  const ids=a.maquinasAutorizadas||[];
  let list=ids.map(id=>MAQUINAS.find(m=>m.id===id)).filter(Boolean);
  if(!list.length){
    const curso=(a.curso||'').toLowerCase();
    if(curso.includes('escavadora'))list.push(MAQUINAS[0]);
    if(curso.includes('pá')||curso.includes('pa mecan')||curso.includes('pá mecânica'))list.push(MAQUINAS[1]);
    if(curso.includes('empilhadora'))list.push(MAQUINAS[2]);
    if(!list.length)list=[MAQUINAS[0],MAQUINAS[1],MAQUINAS[2]];
  }
  return list;
}
function fmtDate(v){if(!v)return'—';if(typeof v==='object'&&v.seconds)return new Date(v.seconds*1000).toLocaleDateString('pt-MZ');return String(v);}
